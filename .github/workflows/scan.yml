# Runs the beta of n8n's community package scanner (the version the Creator Portal uses) (the check n8n uses for verification) on the published package.
name: Scan published package

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npx -y @n8n/scan-community-package@beta "$(node -p "require('./package.json').name")"
