# Publishes every package whose version is not on npm yet, with npm provenance (required by n8n since May 2026
# for verified community nodes). Run it from the Actions tab after bumping VERSION in generate.mjs.
#
# npm authentication: the NPM_TOKEN repository secret (a granular access token with read and write access to
# the n8n-nodes-compasslab-* packages). Provenance is signed by GitHub's OIDC token either way.
name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Publish new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already on npm)"
            else
              echo "publish ${name}@${version}"
              (cd "$dir" && npm run release)
            fi
          done
